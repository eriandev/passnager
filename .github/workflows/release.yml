name: Release Build

# Triggered by pushing the tag that `release-it` created locally:
#
#   pnpm release && git push origin main --follow-tags
#
# The version, the CHANGELOG and the tag are all produced by `release-it` on
# your machine (see .release-it.json), so this workflow never decides what the
# next version is. It only reacts to the tag, and because the release is
# created by `tauri-action` *after* the `test` job, a failing vault test means
# there is no release and no installers at all, instead of a published release
# with missing binaries.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Linux dependencies 🐧
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Rust stable 🦀
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache ♻️
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Test 🧪
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis,msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup pnpm 🗜️
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24.21.0
          cache: true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache ♻️
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies 🐧
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies 💼
        run: pnpm install --frozen-lockfile

      # The release title is the tag exactly as pushed (`v1.2.3`), so the release
      # heading and the tag always read identically. The body is exactly the
      # section that `release-it` just added to CHANGELOG.md for that version. The
      # heading line itself is dropped, because the title already says which
      # version this is and the compare link is noise once you are already on the
      # release page.
      #
      # The CHANGELOG stores bare versions (`## [1.2.3]`), so the `v` is stripped
      # for the lookup only.
      #
      # It fails loudly when the version is missing from the CHANGELOG instead of
      # publishing an empty release, which is the failure mode worth being strict
      # about: an empty body is much harder to notice than a red build.
      #
      # The copy is done with awk because the job is to move a section verbatim, so
      # the file is read and written as raw bytes and never re-encoded to whatever
      # codepage the runner uses. That is what keeps the emoji `release-it` writes
      # into the CHANGELOG (`🐛 fix`, `🚜 build`, `📚 docs`, `⚙️ ci`, `✨ features`,
      # ...) intact, including on Windows.
      #
      # `shell: bash` is explicit because the default shell on windows-latest is
      # PowerShell, which cannot run awk and knows no `${VAR#prefix}` expansion. Git
      # Bash is preinstalled there and brings its own awk, so the script is identical
      # on both platforms.
      - name: Read version notes from CHANGELOG 📝
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          # Only POSIX awk is used (`substr` and not `gensub`, and no /dev/stderr),
          # so the script behaves the same on gawk, mawk and busybox. Headings are
          # matched by comparing exact substrings instead of a pattern, because the
          # dots in a semver would otherwise be wildcards and `0.3.1` would match a
          # `0.3.10` heading.
          if ! BODY="$(
            awk -v version="$VERSION" '
              function is_heading(line,   rest, n, c) {
                if (substr(line, 1, 3) != "## ") return 0
                rest = substr(line, 4)
                sub(/^[ \t]+/, "", rest)
                if (substr(rest, 1, 1) == "[") rest = substr(rest, 2)
                n = length(version)
                if (substr(rest, 1, n) != version) return 0
                rest = substr(rest, n + 1)
                c = substr(rest, 1, 1)
                return rest == "" || c == "]" || c == "(" || c == " " || c == "\t"
              }
              {
                line = $0
                sub(/\r$/, "", line)
                if (found) {
                  if (substr(line, 1, 3) == "## ") exit
                  print line
                } else if (is_heading(line)) {
                  found = 1
                }
              }
              END { if (!found) exit 3 }
            ' CHANGELOG.md
          )"; then
            echo "CHANGELOG.md has no section for version '$VERSION'" >&2
            exit 1
          fi

          # Trim the blank lines that surround the section, so the body does not
          # start or end with empty lines.
          BODY="${BODY#"${BODY%%[![:space:]]*}"}"
          BODY="${BODY%"${BODY##*[![:space:]]}"}"

          if [ -z "$BODY" ]; then
            echo "the '$VERSION' section of CHANGELOG.md is empty" >&2
            exit 1
          fi

          # A semver prerelease such as x.x.x-rc.1 becomes a GitHub prerelease.
          if [ "${VERSION#*-}" != "$VERSION" ]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            printf 'prerelease=%s\n' "$PRERELEASE"
            printf 'release_body<<CHANGELOG_EOF\n'
            printf '%s\n' "$BODY"
            printf 'CHANGELOG_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app 🛠️
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.release_body }}
          prerelease: ${{ steps.notes.outputs.prerelease }}
          args: ${{ matrix.args }}
